<svg xmlns="http://www.w3.org/2000/svg" width="420" height="228" viewBox="0 0 420 228" role="img" aria-labelledby="title desc">
  <title id="title">Daft + Doris</title>
  <desc id="desc">Read and write Apache Doris from Daft data pipelines. Daft / Python / Apache Doris.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#11232B"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#39D0D8"/>
      <stop offset="1" stop-color="#69D9A9"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#39D0D8" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#39D0D8" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame"><rect width="420" height="228" rx="20"/></clipPath>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="419" height="227" rx="20" fill="url(#background)" stroke="#2A3B48"/>
  <path d="M 28 30 H 64" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
  <path d="M 367 35 H 387 V 55 M 387 35 L 366 56" fill="none" stroke="#9DAEBB" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="28" y="83" fill="#E6EDF3" font-size="32" font-weight="700" letter-spacing="-0.7">Daft + Doris</text>
  <text x="28" y="125" fill="#9DAEBB" font-size="19">Read and write Apache Doris</text>
  <text x="28" y="153" fill="#9DAEBB" font-size="19">from Daft data pipelines.</text>
  <text x="28" y="199" fill="#39D0D8" font-size="18" font-weight="500">Daft / Python / Apache Doris</text>
</svg>
